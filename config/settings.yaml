# ============================================================
#  CCTV Inteligente — Configuración
#  Todos los valores son opcionales; los ausentes usan defaults.
# ============================================================

# --- Modelo / inferencia ---
model_file: "yolov8s.pt"      # 's' recupera personas lejanas/pequeñas que 'n' pierde
imgsz: 576                  # equilibrio CPU: capta personas lejanas sin caída de FPS
imgsz_stream: 512           # stream IP/WiFi (celular): entrada menor a YOLO da margen de FPS ante jitter de red
conf: 0.35                  # estricto: juguetes/texturas ya no se leen como persona
iou: 0.55                   # NMS balanceado: separa personas sin duplicar cajas
detect_classes: [0]         # SOLO 'person' de COCO (filtro de clase estricto)
tracker: "bytetrack_cctv.yaml"   # YAML propio en config/ (buffer 60, match 0.60)
torch_threads: 4            # hilos de CPU para PyTorch (resto para captura/GUI)

# --- Pipeline ---
analysis_width: 960         # lienzo interno fijo de analítica
analysis_height: 540
render_fps: 30              # refresco de la GUI
jpeg_quality: 90            # calidad de fotos de evidencia

# --- Analítica ---
line_hysteresis_px: 5       # banda muerta anti-doble-conteo (px en lienzo)
alert_cooldown_s: 8.0       # segundos mínimos entre alertas del mismo track ID
alert_banner_s: 2.5         # duración del banner de intrusión en pantalla
invert_direction: false     # invertir sentido ENTRADA/SALIDA de la línea de conteo

# --- Fuentes ---
webcam_index: 0
webcam_width: 640
webcam_height: 480
webcam_fps: 30
webcam_mirror: true         # modo espejo (flip horizontal) solo en webcam integrada
# Cámara Ezviz CS-C6N detectada en 192.168.100.59 (MAC a0:ff:0c, OUI Hikvision).
# NOTA 2026-11-10: el firmware actual tiene el servicio RTSP APAGADO (puerto 554
# rechaza conexiones; escaneo 1-65535 sin RTSP). La URL queda preconfigurada
# por si se habilita RTSP en un firmware futuro; hoy usar webcam o archivo MP4.
default_stream_url: "rtsp://admin:ABLLAD@192.168.100.59:554/h264/ch1/main"

# Flags FFmpeg para streams IP/RTSP (formato OpenCV: clave;valor | ...).
# fflags=nobuffer + flags=low_delay minimizan el buffer interno; el
# framedrop de frames viejos lo ejecuta read_freshest() en capture.py.
ffmpeg_options: "rtsp_transport;tcp|stimeout;5000000|max_delay;500000|fflags;nobuffer|flags;low_delay|reorder_queue_size;0|probesize;32|analyzeduration;0|reconnect;1|reconnect_streamed;1|reconnect_delay_max;2"

# Vaciado del backlog del decodificador (zero-delay en streams/webcam):
# un grab() que retorna al instante = frame viejo encolado -> descartado;
# un grab() que tarda >= fresh_grab_ms = esperó a la red -> frame fresco.
low_latency: true           # activar read_freshest() (latest-frame-wins)
drain_max_grabs: 30         # tope de frames viejos descartados por lectura
fresh_grab_ms: 25           # umbral de "grab bloqueante" = frame fresco (ms)

read_fail_threshold: 30     # lecturas fallidas seguidas antes de reconectar
reconnect_backoff_s: [1.0, 2.0, 4.0, 8.0, 10.0]

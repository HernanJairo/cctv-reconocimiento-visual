# ============================================================
# ByteTrack afinado para CCTV cenital/distante — conf=0.20.
# Umbrales bajos: los peatones lejanos puntúan 0.20-0.30 y con
# los defaults (new_track 0.45, high 0.35) jamás recibían ID.
# ============================================================
tracker_type: bytetrack     # NO cambiar a botsort (warnings GMC, más lento)
track_high_thresh: 0.25     # primer matching: detecciones de score >= esto
track_low_thresh: 0.10      # segundo matching: sostiene tracks en oclusión
new_track_thresh: 0.20      # = conf: una detección débil ya puede crear ID
track_buffer: 60            # frames que sobrevive un track perdido (~2s @30fps)
match_thresh: 0.65          # asociación: tolera el jitter de cajas pequeñas
fuse_score: true            # fusiona score con IoU/movimiento al asociar

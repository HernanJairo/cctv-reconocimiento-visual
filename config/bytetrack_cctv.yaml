# ============================================================
# ByteTrack afinado para CCTV — persistencia de IDs a baja
# confianza (conf=0.15) e inferencia en CPU.
# ============================================================
tracker_type: bytetrack     # NO cambiar a botsort (warnings GMC, más lento)
track_high_thresh: 0.20     # primer matching: detecciones de score >= esto
track_low_thresh: 0.1       # segundo matching: recupera detecciones débiles
new_track_thresh: 0.25      # score mínimo para crear un track nuevo
track_buffer: 60            # frames que sobrevive un track perdido (~2s @30fps)
match_thresh: 0.60          # asociación estricta: dos personas solapadas NO se fusionan
fuse_score: true            # fusiona score con IoU/movimiento al asociar
